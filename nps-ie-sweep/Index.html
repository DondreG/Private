<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #1f2328; --muted: #5f6b76; --line: #e3e7eb;
    --brand: #1f4e79; --brand-ink: #ffffff; --accent: #188038;
    --amber-bg: #fdf0c8; --amber-ink: #7a5300; --red-bg: #f8d4d0; --red-ink: #8a1c12;
    --chip: #e8eef4; --focus: #2b6cb0; --resolved: #9aa3ab;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181c; --card: #1d2227; --ink: #e6e9ec; --muted: #9aa5af; --line: #2c333a;
      --brand: #2f6aa3; --chip: #26303a; --amber-bg: #4a3b10; --amber-ink: #f5d27a;
      --red-bg: #4d1f1a; --red-ink: #f4a69c; --resolved: #6b747c; --focus: #6aa8e8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header { background: var(--brand); color: var(--brand-ink); padding: 14px 16px; }
  .head { max-width: 1100px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .head h1 { font-size: 19px; margin: 0; }
  .head p { margin: 2px 0 0; opacity: .85; font-size: 13px; }
  .head .grow { flex: 1; min-width: 200px; }
  .btn { border: 1px solid rgba(255,255,255,.55); background: transparent; color: inherit; border-radius: 6px;
    padding: 7px 12px; font: inherit; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn.solid { background: #fff; color: var(--brand); border-color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .6; cursor: wait; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 40px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 20px;
    padding: 7px 14px; font: inherit; cursor: pointer; white-space: nowrap; }
  .tab b { margin-left: 6px; background: var(--chip); border-radius: 10px; padding: 0 7px; font-size: 12px; }
  .tab.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tab.on b { background: rgba(255,255,255,.25); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 12px; }
  .panel h2 { font-size: 16px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 8px 12px; min-width: 120px; }
  .stat .n { font-size: 22px; font-weight: 700; color: var(--brand); line-height: 1.1; }
  @media (prefers-color-scheme: dark) { .stat .n { color: #8cc0f0; } }
  .stat .l { font-size: 12px; color: var(--muted); }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  select, input[type=search], input[type=text] { font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input[type=search] { flex: 1; min-width: 160px; }
  label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .legend { color: var(--muted); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .clinic { margin-top: 18px; }
  .clinic h3 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .pt { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    display: grid; grid-template-columns: 1fr minmax(260px, 340px); gap: 10px 18px; }
  .pt.resolved { opacity: .65; }
  .pt.resolved .name { text-decoration: line-through; color: var(--resolved); }
  .name { font-weight: 600; font-size: 15px; }
  .dates { margin-top: 2px; }
  .pill { display: inline-block; border-radius: 10px; padding: 0 8px; font-weight: 700; font-size: 12px; margin-left: 6px; }
  .pill.amber { background: var(--amber-bg); color: var(--amber-ink); }
  .pill.red { background: var(--red-bg); color: var(--red-ink); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .notes { color: var(--muted); font-size: 13px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; overflow-wrap: anywhere; }
  .notes.open { -webkit-line-clamp: unset; }
  .src { font-size: 12px; margin-top: 4px; }
  .src a { color: var(--focus); }
  .fu { display: flex; flex-direction: column; gap: 6px; }
  .fu select, .fu input { width: 100%; }
  .saved { font-size: 12px; color: var(--muted); min-height: 16px; }
  .saved.ok { color: var(--accent); }
  .saved.err { color: var(--red-ink); }
  .empty, .loading, .error { text-align: center; color: var(--muted); padding: 30px 10px; }
  .error { color: var(--red-ink); }
  @media (max-width: 700px) {
    .pt { grid-template-columns: 1fr; }
    .head .btn { padding: 6px 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="grow">
      <h1>NPS IE Sweep</h1>
      <p>New patients booked into a later week than they called</p>
    </div>
    <a class="btn" id="sheetLink" href="#" target="_blank" rel="noopener">Open sheet</a>
    <button class="btn solid" id="refreshBtn" type="button">Refresh now</button>
  </div>
</header>
<main>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view"><div class="loading">Loading…</div></div>
</main>

<script>
  var state = { data: null, tab: null, clinic: '', q: '', hideWorked: false };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function server() {
    // Local preview (outside Apps Script) uses window.MOCK_API.
    return (window.google && google.script && google.script.run) ? google.script.run : window.MOCK_API;
  }

  function load() {
    server().withSuccessHandler(setData).withFailureHandler(showError).getDashboardData();
  }

  function setData(data) {
    state.data = data;
    document.getElementById('sheetLink').href = data.sheetUrl;
    if (!state.tab || !data.tabs.some(function (t) { return t.name === state.tab; })) {
      state.tab = data.tabs.length ? data.tabs[0].name : null;
    }
    render();
  }

  function showError(err) {
    var v = document.getElementById('view');
    v.textContent = '';
    v.appendChild(el('div', 'error', 'Could not load: ' + (err && err.message ? err.message : err)));
  }

  function tabLabel(t) {
    var date = t.name.replace(/^.*Week of /, '').replace(/-\d\d$/, '').replace('-', '/');
    return (t.kind === 'ies' ? 'IEs week of ' : 'Calls week of ') + date;
  }

  function worked(r) { return !!(r.followUp || r.followUpNotes) || r.resolved; }

  function render() {
    var tabsEl = document.getElementById('tabs');
    tabsEl.textContent = '';
    state.data.tabs.forEach(function (t) {
      var b = el('button', 'tab' + (t.name === state.tab ? ' on' : ''), tabLabel(t));
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', t.name === state.tab);
      b.appendChild(el('b', '', String(t.rows.filter(function (r) { return !r.resolved; }).length)));
      b.onclick = function () { state.tab = t.name; state.clinic = ''; render(); };
      tabsEl.appendChild(b);
    });

    var v = document.getElementById('view');
    v.textContent = '';
    var tab = state.data.tabs.filter(function (t) { return t.name === state.tab; })[0];
    if (!tab) { v.appendChild(el('div', 'empty', 'No weekly tabs yet. Click "Refresh now".')); return; }

    var panel = el('div', 'panel');
    panel.appendChild(el('h2', '', tab.title));
    panel.appendChild(el('div', 'sub', tab.subtitle));

    var live = tab.rows.filter(function (r) { return !r.resolved; });
    var stats = el('div', 'stats');
    [[live.length, 'patients'],
     [live.filter(function (r) { return !worked(r); }).length, 'not yet worked'],
     [live.filter(function (r) { return Number(r.daysPastCallWeek) >= 7; }).length, '7+ days past call week']
    ].forEach(function (s) {
      var d = el('div', 'stat');
      d.appendChild(el('div', 'n', String(s[0])));
      d.appendChild(el('div', 'l', s[1]));
      stats.appendChild(d);
    });
    panel.appendChild(stats);

    var tools = el('div', 'tools');
    var clinicSel = el('select');
    clinicSel.setAttribute('aria-label', 'Clinic');
    clinicSel.appendChild(new Option('All clinics', ''));
    uniq(tab.rows.map(function (r) { return r.clinic; })).forEach(function (c) {
      clinicSel.appendChild(new Option(c, c));
    });
    clinicSel.value = state.clinic;
    clinicSel.onchange = function () { state.clinic = clinicSel.value; renderList(tab, list); };
    var search = el('input');
    search.type = 'search'; search.placeholder = 'Search patient, insurance, notes…'; search.value = state.q;
    search.setAttribute('aria-label', 'Search');
    search.oninput = function () { state.q = search.value; renderList(tab, list); };
    var hide = el('label', 'chk');
    var cb = el('input'); cb.type = 'checkbox'; cb.checked = state.hideWorked;
    cb.onchange = function () { state.hideWorked = cb.checked; renderList(tab, list); };
    hide.appendChild(cb); hide.appendChild(document.createTextNode('Hide worked'));
    tools.appendChild(clinicSel); tools.appendChild(search); tools.appendChild(hide);
    panel.appendChild(tools);

    var legend = el('div', 'legend');
    legend.style.marginTop = '10px';
    legend.appendChild(swatch('var(--amber-bg)', '1–6 days past call week'));
    legend.appendChild(swatch('var(--red-bg)', '7+ days'));
    legend.appendChild(el('span', '', 'Updated ' + state.data.loadedAt));
    panel.appendChild(legend);
    v.appendChild(panel);

    var list = el('div');
    v.appendChild(list);
    renderList(tab, list);
  }

  function swatch(color, text) {
    var s = el('span');
    var b = el('span', 'sw'); b.style.background = color;
    s.appendChild(b); s.appendChild(document.createTextNode(text));
    return s;
  }

  function byName(x, y) { return x.localeCompare(y, undefined, { sensitivity: 'base' }); }

  function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }).sort(byName); }

  function renderList(tab, list) {
    list.textContent = '';
    var q = state.q.trim().toLowerCase();
    var rows = tab.rows.filter(function (r) {
      if (state.clinic && r.clinic !== state.clinic) return false;
      if (state.hideWorked && worked(r)) return false;
      if (!q) return true;
      return [r.patient, r.primaryIns, r.notes, r.takenBy, r.diagnosis, r.followUpNotes]
        .join(' ').toLowerCase().indexOf(q) !== -1;
    });
    if (!rows.length) {
      list.appendChild(el('div', 'empty', tab.rows.length ? 'Nothing matches these filters.' : 'No patients on this tab.'));
      return;
    }
    var byClinic = {};
    rows.forEach(function (r) { (byClinic[r.clinic] = byClinic[r.clinic] || []).push(r); });
    Object.keys(byClinic).sort(byName).forEach(function (c) {
      var sec = el('section', 'clinic');
      sec.appendChild(el('h3', '', c + ' · ' + byClinic[c].length));
      byClinic[c].forEach(function (r) { sec.appendChild(card(tab, r)); });
      list.appendChild(sec);
    });
  }

  function card(tab, r) {
    var d = el('div', 'pt' + (r.resolved ? ' resolved' : ''));
    var left = el('div');
    left.appendChild(el('div', 'name', r.patient));
    var dates = el('div', 'dates', 'Called ' + r.callDate + ' → IE ' + r.ieDate);
    var days = Number(r.daysPastCallWeek);
    if (!r.resolved && days >= 1) {
      var p = el('span', 'pill ' + (days >= 7 ? 'red' : 'amber'), days + 'd');
      p.title = days + ' days past the end of the week they called';
      dates.appendChild(p);
    }
    left.appendChild(dates);
    var meta = [r.primaryIns, r.diagnosis, r.referral, r.takenBy ? 'taken by ' + r.takenBy : '']
      .filter(Boolean).join(' · ');
    if (r.resolved) meta = 'Resolved: ' + r.status + (meta ? ' · ' + meta : '');
    if (meta) left.appendChild(el('div', 'meta', meta));
    if (r.notes) {
      var n = el('div', 'notes', r.notes);
      n.title = 'Click to expand';
      n.onclick = function () { n.classList.toggle('open'); };
      left.appendChild(n);
    }
    if (r.sourceUrl) {
      var s = el('div', 'src');
      var a = el('a', '', 'Open in NPS (' + r.sourceLabel + ')');
      a.href = r.sourceUrl; a.target = '_blank'; a.rel = 'noopener';
      s.appendChild(a);
      left.appendChild(s);
    }
    d.appendChild(left);

    var fu = el('div', 'fu');
    var sel = el('select');
    sel.setAttribute('aria-label', 'Follow-up for ' + r.patient);
    sel.appendChild(new Option('Follow-up…', ''));
    var opts = state.data.followUpOptions.slice();
    if (r.followUp && opts.indexOf(r.followUp) === -1) opts.push(r.followUp);
    opts.forEach(function (o) { sel.appendChild(new Option(o, o)); });
    sel.value = r.followUp || '';
    var notes = el('input');
    notes.type = 'text'; notes.placeholder = 'Follow-up notes'; notes.value = r.followUpNotes || '';
    notes.setAttribute('aria-label', 'Follow-up notes for ' + r.patient);
    var status = el('div', 'saved');
    function save() {
      if (sel.value === (r.followUp || '') && notes.value === (r.followUpNotes || '')) return;
      status.className = 'saved'; status.textContent = 'Saving…';
      server().withSuccessHandler(function (res) {
        r.followUp = sel.value; r.followUpNotes = notes.value;
        status.className = 'saved ok'; status.textContent = 'Saved ' + res.savedAt;
      }).withFailureHandler(function (err) {
        status.className = 'saved err'; status.textContent = 'Not saved: ' + (err && err.message ? err.message : err);
      }).saveFollowUp(tab.name, r.key, sel.value, notes.value);
    }
    sel.onchange = save;
    notes.onchange = save;
    fu.appendChild(sel); fu.appendChild(notes); fu.appendChild(status);
    d.appendChild(fu);
    return d;
  }

  document.getElementById('refreshBtn').onclick = function () {
    var b = this;
    b.disabled = true; b.textContent = 'Refreshing… (~1 min)';
    server().withSuccessHandler(function (data) {
      b.disabled = false; b.textContent = 'Refresh now'; setData(data);
    }).withFailureHandler(function (err) {
      b.disabled = false; b.textContent = 'Refresh now'; showError(err);
    }).refreshNow();
  };

  load();
</script>
</body>
</html>
